# Pre-composed bidding-tree filters ("topics") offered by the quiz sidebar.
#
# Each topic is a named bundle of auction-prefix patterns. An auction belongs
# to the topic if it matches ANY of the patterns. Selecting several topics
# (or typing them comma-separated in the filter box) ORs them together.
#
#   [topics."Some name"]
#   patterns    = ["1D-1M", "1D-2M"]   # required
#   description = "shown as a tooltip"   # optional
#   systems     = ["squad-system.bml"]   # optional; omit = all systems
#
# Pattern syntax (see bidfilter.py):
#   1D 2H 3N      a bid; suits C D H S N
#   M / m         major class {H,S} / minor class {C,D} — case matters here
#   1*  /  *      any suit at that level / any call at all
#   Pass X XX     pass, double, redouble
#   (...)         the opponents made this call
#   - or space    separates calls; bml's `--` also works
#
# A pattern describes OUR auction: opponent calls it does not mention are
# stepped over, so 1D-1H matches 1D (Pass) 1H, 1D (1S) 1H and 1D (X) 1H.
# Bracket a call to pin the opponents down at that exact point.
#
# Patterns match a PREFIX of the auction, so "1C" covers every auction that
# starts 1C. Everything is case-insensitive except M vs m.
#
# Editing this file needs no code change — restart the app to pick it up.

[topics."1C opening"]
patterns = ["1C"]
description = "Every auction starting with a 1C opening."

[topics."1D opening"]
patterns = ["1D"]
description = "Every auction starting with a 1D opening."

[topics."Major openings"]
patterns = ["1M"]
description = "1H or 1S openings."

[topics."1NT opening"]
patterns = ["1N"]
description = "Every auction starting with a 1NT opening."

[topics."2C opening"]
patterns = ["2C"]
description = "Every auction starting with a 2C opening."

[topics."2NT opening"]
patterns = ["2N"]
description = "Every auction starting with a 2NT opening."

[topics."Weak twos"]
patterns = ["2D", "2H", "2S"]
description = "Two-level suit openings other than 2C."

[topics."Preempts"]
patterns = ["3C", "3D", "3H", "3S", "4C", "4D", "4H", "4S"]
description = "Three-level and four-level openings."

[topics."Responses to 1C"]
patterns = ["1C-1*", "1C-2*", "1C-3*"]
description = "Our 1C opening and partner's response, whatever the opponents do."

[topics."Major raises"]
patterns = ["1M-2M", "1M-3M", "1M-4M"]
description = "Partner raises our major opening."

[topics."Notrump responses"]
patterns = ["1*-1N", "1*-2N", "1*-3N"]
description = "Partner responds in notrump to a one-level opening."

# `1*`..`7*` is "our bid at that level" -- spelled out because a bare `*`
# would also allow the opponents to have opened.
[topics."Opponents interfere"]
patterns = ["1*-(*)", "2*-(*)", "3*-(*)", "4*-(*)", "5*-(*)", "6*-(*)", "7*-(*)"]
description = "We open, the opponents do something other than pass."

[topics."Opponents double"]
patterns = ["1*-(X)", "2*-(X)", "3*-(X)", "4*-(X)", "5*-(X)", "6*-(X)", "7*-(X)"]
description = "We open and the opponents double."

[topics."Opponents opened"]
patterns = ["(*)"]
description = "The opponents opened the bidding."

[topics."Long auctions"]
patterns = ["*-*-*-*-*-*"]
description = "Auctions six or more calls deep — the competitive and slam sequences."
