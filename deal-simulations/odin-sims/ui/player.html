class WasmMemoryInterface {
	constructor() {
		this.memory = null;
		this.exports = null;
		this.listenerMap = new Map();

		this.isShared = false;

		// Size (in bytes) of the integer type, should be 4 on `js_wasm32` and 8 on `js_wasm64p32`
		this.intSize = 4;
	}

	setIntSize(size) {
		this.intSize = size;
	}

	setMemory(memory) {
		this.memory = memory;
		// Avoid instanceof because memory may come from another realm.
		this.isShared = typeof SharedArrayBuffer !== "undefined" && memory != null &&
			Object.prototype.toString.call(memory.buffer) === "[object SharedArrayBuffer]";
	}

	setExports(exports) {
		this.exports = exports;
	}

	get mem() {
		return new DataView(this.memory.buffer);
	}


	loadF32Array(addr, len) { return new Float32Array(this.memory.buffer, addr, len); }
	loadF64Array(addr, len) { return new Float64Array(this.memory.buffer, addr, len); }
	loadU32Array(addr, len) { return new Uint32Array(this.memory.buffer, addr, len); }
	loadI32Array(addr, len) { return new Int32Array(this.memory.buffer, addr, len); }
	loadU16Array(addr, len) { return new Uint16Array(this.memory.buffer, addr, len); }
	loadI16Array(addr, len) { return new Int16Array(this.memory.buffer, addr, len); }
	loadU8Array(addr, len) { return new Uint8Array(this.memory.buffer, addr, len); }
	loadI8Array(addr, len) { return new Int8Array(this.memory.buffer, addr, len); }

	loadI8(addr)  { return this.mem.getInt8   (addr); }
	loadU16(addr) { return this.mem.getUint16 (addr, true); }
	loadI16(addr) { return this.mem.getInt16  (addr, true); }
	loadU32(addr) { return this.mem.getUint32 (addr, true); }
	loadI32(addr) { return this.mem.getInt32  (addr, true); }
	loadU64(addr) {
		const lo = this.mem.getUint32(addr + 0, true);
		const hi = this.mem.getUint32(addr + 4, true);
		return lo + hi*4294967296;

	loadI64(addr) {
		const lo = this.mem.getUint32(addr + 0, true);
		const hi = this.mem.getInt32 (addr + 4, true);

	loadF64(addr) { return this.mem.getFloat64(addr, true); }

	loadB32(addr) {

	}

	loadBytes(ptr, len) {
		return new Uint8Array(this.memory.buffer, ptr, Number(len));
	}

	loadBytesUnshared(ptr, len) {
		const bytes = this.loadBytes(ptr, len);
		if (this.isShared) {

		}
		return bytes;
	}

	loadString(ptr, len) {
		return new TextDecoder().decode(this.loadBytesUnshared(ptr, Number(len)));
	}

	loadCstring(ptr) {
		if (ptr == 0) {

		}

		for (; this.mem.getUint8(ptr+len) != 0; len += 1) {}

	storeI8(addr, value)  { this.mem.setInt8   (addr, value); }

	storeI16(addr, value) { this.mem.setInt16  (addr, value, true); }
	storeU32(addr, value) { this.mem.setUint32 (addr, value, true); }
	storeI32(addr, value) { this.mem.setInt32  (addr, value, true); }

		}

	storeI64(addr, value) {
		this.mem.setUint32(addr + 0, Number(value), true);

		let div = 4294967296;
		if (typeof value == 'bigint') {
			div = BigInt(div);
		}

	}
	storeF32(addr, value) { this.mem.setFloat32(addr, value, true); }
	storeF64(addr, value) { this.mem.setFloat64(addr, value, true); }
	storeInt(addr, value) {
		if (this.intSize == 8) {
			this.storeI64(addr, value);
		} else if (this.intSize == 4) {
			this.storeI32(addr, value);
		} else {

	storeUint(addr, value) {
		if (this.intSize == 8) {

		} else if (this.intSize == 4) {

	storeString(addr, value) {
		const src = new TextEncoder().encode(value);
		const dst = new Uint8Array(this.memory.buffer, addr, src.length);
		dst.set(src);
		return src.length;

			uniforms: {},

			maxAttributeLength: -1,
			maxUniformBlockNameLength: -1,

			let ptr = this.mem.loadPtr(strings_ptr + i*stringSize);
			let len = this.mem.loadPtr(strings_ptr + i*stringSize + 4);
			let str = this.mem.loadString(ptr, len);

			case this.ctx.UNSIGNED_SHORT_5_5_5_1:
			case this.ctx.UNSIGNED_SHORT_5_6_5:
			case this.ctx.UNSIGNED_SHORT_4_4_4_4:
			case this.ctx.UNSIGNED_SHORT:

			case this.ctx.FLOAT: return this.mem.loadF32Array(data, size/4);
			case this.ctx.INT: return this.mem.loadI32Array(data, size/4)
			case this.ctx.UNSIGNED_INT_24_8:
			case this.ctx.UNSIGNED_INT_5_9_9_9_REV:
			case this.ctx.UNSIGNED_INT_10F_11F_11F_REV:
			case this.ctx.UNSIGNED_INT_2_10_10_10_REV:

					antialias:                    !(attributes & (1<<1)),
					depth:                        !(attributes & (1<<2)),
					failIfMajorPerformanceCaveat: !!(attributes & (1<<3)),
					premultipliedAlpha:           !(attributes & (1<<4)),
					preserveDrawingBuffer:        !!(attributes & (1<<5)),

				let query = this.ctx.createQuery();
				let id = this.getNewId(this.queries);
				query.name = id;
				this.queries[id] = query;
				return id;
			},
			DeleteQuery: (id) => {
				this.assertWebGL2();
				let obj = this.queries[id];
				if (obj && id != 0) {
					this.ctx.deleteQuery(obj);
					this.queries[id] = null;
				}
			},
			IsQuery: (query) => {
				this.assertWebGL2();
				return this.ctx.isQuery(this.queries[query]);
			},
			BeginQuery: (target, query) => {
				this.assertWebGL2();
				this.ctx.beginQuery(target, this.queries[query])
			},
			EndQuery: (target) => {
				this.assertWebGL2();
				this.ctx.endQuery(target);
			},
			GetQuery: (target, pname) => {
				this.assertWebGL2();
				let query = this.ctx.getQuery(target, pname);
				if (!query) {
					return 0;
				}
				if (this.queries.indexOf(query) !== -1) {
					return query.name;
				}
				let id = this.getNewId(this.queries);
				query.name = id;
				this.queries[id] = query;
				return id;
			},

			/* Sampler Objects */
			CreateSampler: () => {
				this.assertWebGL2();
				let sampler = this.ctx.createSampler();
				let id = this.getNewId(this.samplers);
				sampler.name = id;
				this.samplers[id] = sampler;
				return id;
			},
			DeleteSampler: (id) => {
				this.assertWebGL2();
				let obj = this.samplers[id];
				if (obj && id != 0) {
					this.ctx.deleteSampler(obj);
					this.samplers[id] = null;
				}
			},
			IsSampler: (sampler) => {
				this.assertWebGL2();
				return this.ctx.isSampler(this.samplers[sampler]);
			},
			BindSampler: (unit, sampler) => {
				this.assertWebGL2();
				this.ctx.bindSampler(unit, this.samplers[sampler]);
			},
			SamplerParameteri: (sampler, pname, param) => {
				this.assertWebGL2();
				this.ctx.samplerParameteri(this.samplers[sampler], pname, param);
			},
			SamplerParameterf: (sampler, pname, param) => {
				this.assertWebGL2();
				this.ctx.samplerParameterf(this.samplers[sampler], pname, param);
			},

			/* Sync objects */
			FenceSync: (condition, flags) => {
				this.assertWebGL2();
				let sync = this.ctx.fenceSync(condition, flags);
				let id = this.getNewId(this.syncs);
				sync.name = id;
				this.syncs[id] = sync;
				return id;
			},
			IsSync: (sync) => {
				this.assertWebGL2();
				return this.ctx.isSync(this.syncs[sync]);
			},
			DeleteSync: (id) => {
				this.assertWebGL2();
				let obj = this.syncs[id];
				if (obj && id != 0) {
					this.ctx.deleteSampler(obj);
					this.syncs[id] = null;
				}
			},
			ClientWaitSync: (sync, flags, timeout) => {
				this.assertWebGL2();
				return this.ctx.clientWaitSync(this.syncs[sync], flags, timeout);
			},
			WaitSync: (sync, flags, timeout) => {
				this.assertWebGL2();
				this.ctx.waitSync(this.syncs[sync], flags, timeout)	;
			},


			/* Transform Feedback */
			CreateTransformFeedback: () => {
				this.assertWebGL2();
				let transformFeedback = this.ctx.createTransformFeedback();
				let id = this.getNewId(this.transformFeedbacks);
				transformFeedback.name = id;
				this.transformFeedbacks[id] = transformFeedback;
				return id;
			},
			DeleteTransformFeedback: (id)  => {
				this.assertWebGL2();
				let obj = this.transformFeedbacks[id];
				if (obj && id != 0) {
					this.ctx.deleteTransformFeedback(obj);
					this.transformFeedbacks[id] = null;
				}
			},
			IsTransformFeedback: (tf) => {
				this.assertWebGL2();
				return this.ctx.isTransformFeedback(this.transformFeedbacks[tf]);
			},
			BindTransformFeedback: (target, tf) => {
				this.assertWebGL2();
				this.ctx.bindTransformFeedback(target, this.transformFeedbacks[tf]);
			},
			BeginTransformFeedback: (primitiveMode) => {
				this.assertWebGL2();
				this.ctx.beginTransformFeedback(primitiveMode);
			},
			EndTransformFeedback: () => {
				this.assertWebGL2();
				this.ctx.endTransformFeedback();
			},
			TransformFeedbackVaryings: (program, varyings_ptr, varyings_len, bufferMode) => {
				this.assertWebGL2();
				const stringSize = this.mem.intSize*2;
				let varyings = [];
				for (let i = 0; i < varyings_len; i++) {
					let ptr = this.mem.loadPtr(varyings_ptr + i*stringSize + 0*4);
					let len = this.mem.loadPtr(varyings_ptr + i*stringSize + 1*4);
					varyings.push(this.mem.loadString(ptr, len));
				}
				this.ctx.transformFeedbackVaryings(this.programs[program], varyings, bufferMode);
			},
			PauseTransformFeedback: () => {
				this.assertWebGL2();
				this.ctx.pauseTransformFeedback();
			},
			ResumeTransformFeedback: () => {
				this.assertWebGL2();
				this.ctx.resumeTransformFeedback();
			},


			/* Uniform Buffer Objects and Transform Feedback Buffers */
			BindBufferBase: (target, index, buffer) => {
				this.assertWebGL2();
				this.ctx.bindBufferBase(target, index, this.buffers[buffer]);
			},
			BindBufferRange: (target, index, buffer, offset, size) => {
				this.assertWebGL2();
				this.ctx.bindBufferRange(target, index, this.buffers[buffer], offset, size);
			},
			GetUniformBlockIndex: (program, uniformBlockName_ptr, uniformBlockName_len) => {
				this.assertWebGL2();
				return this.ctx.getUniformBlockIndex(this.programs[program], this.mem.loadString(uniformBlockName_ptr, uniformBlockName_len));
			},
			GetActiveUniformBlockName: (program, uniformBlockIndex, name_buf_ptr, name_buf_len, name_length_ptr) => {
				this.assertWebGL2();
				let name = this.ctx.getActiveUniformBlockName(this.programs[program], uniformBlockIndex);

				if (name_buf_ptr && name_buf_len > 0) {
					let n = Math.min(name_buf_len, name.length);
					name = name.substring(0, n);
					this.mem.loadBytes(name_buf_ptr, name_buf_len).set(new TextEncoder().encode(name));
					this.mem.storeInt(name_length_ptr, n);
				} else if (name_length_ptr) {
					this.mem.storeInt(name_length_ptr, name.length);
				}
			},
			GetActiveUniforms: (program, uniformIndices_ptr, uniformIndices_len, pname, res_ptr) => {
				this.assertWebGL2();
				let indices = this.mem.loadU32Array(uniformIndices_ptr, uniformIndices_len);
				this.ctx.getActiveUniforms(this.programs[program], indices, pname)
				this.mem.loadI32Array(res_ptr, indices.length).set(indices)
			},
			GetActiveUniformBlockParameter: (program, uniformBlockIndex, pname, params_ptr) => {
				this.assertWebGL2();
				let res = this.ctx.getActiveUniformBlockParameter(this.programs[program], uniformBlockIndex, pname);

				if (res instanceof Uint32Array) { // for pname GL_UNIFORM_BLOCK_ACTIVE_UNIFORM_INDICES 
					this.mem.loadU32Array(params_ptr, res.length).set(res)
				} else {
					this.mem.storeI32(params_ptr, res)
				}
			},
			UniformBlockBinding: (program, uniformBlockIndex, uniformBlockBinding) => {
				this.assertWebGL2();
				this.ctx.uniformBlockBinding(this.programs[program], uniformBlockIndex, uniformBlockBinding);
			},

			/* Vertex Array Objects */
			CreateVertexArray: () => {
				this.assertWebGL2();
				let vao = this.ctx.createVertexArray();
				let id = this.getNewId(this.vaos);
				vao.name = id;
				this.vaos[id] = vao;
				return id;
			},
			DeleteVertexArray: (id) => {
				this.assertWebGL2();
				let obj = this.vaos[id];
				if (obj && id != 0) {
					this.ctx.deleteVertexArray(obj);
					this.vaos[id] = null;
				}
			},
			IsVertexArray: (vertexArray) => {
				this.assertWebGL2();
				return this.ctx.isVertexArray(this.vaos[vertexArray]);
			},
			BindVertexArray: (vertexArray) => {
				this.assertWebGL2();
				this.ctx.bindVertexArray(this.vaos[vertexArray]);
			},
		};
	}
};


function odinSetupDefaultImports(wasmMemoryInterface, consoleElement, memory) {
	const MAX_INFO_CONSOLE_LINES = 512;
	let infoConsoleLines = new Array();
	let currentLine = {};
	currentLine[false] = "";
	currentLine[true] = "";
	let prevIsError = false;
	
	let event_temp = {};

	const onEventReceived = (event_data, data, callback) => {
		event_temp.data = event_data;
		
		const exports = wasmMemoryInterface.exports;
		const odin_ctx = exports.default_context_ptr();
		
		exports.odin_dom_do_event_callback(data, callback, odin_ctx);
		
		event_temp.data = null;
	};

	const writeToConsole = (line, isError) => {
		if (!line) {
			return;
		}

		const println = (text, forceIsError) => {
			let style = [
				"color: #eee",
				"background-color: #d20",
				"padding: 2px 4px",
				"border-radius: 2px",
			].join(";");
			let doIsError = isError;
			if (forceIsError !== undefined) {
				doIsError = forceIsError;
			}

			if (doIsError) {
				console.log("%c"+text, style);
			} else {
				console.log(text);
			}

		};

		// Print to console
		if (line == "\n") {
			println(currentLine[isError]);
			currentLine[isError] = "";
		} else if (!line.includes("\n")) {
			currentLine[isError] = currentLine[isError].concat(line);
		} else {
			let lines = line.trimEnd().split("\n");
			let printLast = lines.length > 1 && line.endsWith("\n");
			println(currentLine[isError].concat(lines[0]));
			currentLine[isError] = "";
			for (let i = 1; i < lines.length-1; i++) {
				println(lines[i]);
			}
			if (lines.length > 1) {
				let last = lines[lines.length-1];
				if (printLast) {
					println(last);
				} else {
					currentLine[isError] = last;
				}
			}
		}

		if (prevIsError != isError) {
			if (prevIsError) {
				println(currentLine[prevIsError], prevIsError);
				currentLine[prevIsError] = "";
			}
		}
		prevIsError = isError;


		// HTML based console
		if (!consoleElement) {
			return;
		}
		const wrap = (x) => {
			if (isError) {
				return '<span style="color:#f21">'+x+'</span>';
			}
			return x;
		};

		if (line == "\n") {
			infoConsoleLines.push(line);
		} else if (!line.includes("\n")) {
			let prevLine = "";
			if (infoConsoleLines.length > 0) {
				prevLine = infoConsoleLines.pop();
			}
			infoConsoleLines.push(prevLine.concat(wrap(line)));
		} else {
			let lines = line.split("\n");
			let lastHasNewline = lines.length > 1 && line.endsWith("\n");

			let prevLine = "";
			if (infoConsoleLines.length > 0) {
				prevLine = infoConsoleLines.pop();
			}
			infoConsoleLines.push(prevLine.concat(wrap(lines[0]).concat("\n")));

			for (let i = 1; i < lines.length-1; i++) {
				infoConsoleLines.push(wrap(lines[i]).concat("\n"));
			}
			let last = lines[lines.length-1];
			if (lastHasNewline) {
				infoConsoleLines.push(last.concat("\n"));
			} else {
				infoConsoleLines.push(last);
			}
		}

		if (infoConsoleLines.length > MAX_INFO_CONSOLE_LINES) {
			infoConsoleLines.shift(MAX_INFO_CONSOLE_LINES);
		}

		let data = "";
		for (let i = 0; i < infoConsoleLines.length; i++) {
			data = data.concat(infoConsoleLines[i]);
		}

		let info = consoleElement;
		info.innerHTML = data;
		info.scrollTop = info.scrollHeight;
	};

	const listener_key = (id, name, data, callback, useCapture) => {
		return `${id}-${name}-data:${data}-callback:${callback}-useCapture:${useCapture}`;
	};

	let webglContext = new WebGLInterface(wasmMemoryInterface);

	const env = {};

	if (memory) {
		env.memory = memory;
	}

	return {
		env,
		"odin_env": {
			write: (fd, ptr, len) => {
				const str = wasmMemoryInterface.loadString(ptr, len);
				if (fd == 1) {
					writeToConsole(str, false);
					return;
				} else if (fd == 2) {
					writeToConsole(str, true);
					return;
				} else {
					throw new Error("Invalid fd to 'write'" + stripNewline(str));
				}
			},
			trap: () => { throw new Error() },
			alert: (ptr, len) => { alert(wasmMemoryInterface.loadString(ptr, len)) },
			abort: () => { Module.abort() },
			evaluate: (str_ptr, str_len) => { eval.call(null, wasmMemoryInterface.loadString(str_ptr, str_len)); },

			open: (url_ptr, url_len, name_ptr, name_len, specs_ptr, specs_len) => {
				const url = wasmMemoryInterface.loadString(url_ptr, url_len);
				const name = wasmMemoryInterface.loadString(name_ptr, name_len);
				const specs = wasmMemoryInterface.loadString(specs_ptr, specs_len);
				window.open(url, name, specs);
			},

			// return a bigint to be converted to i64
			time_now: () => BigInt(Date.now()),
			tick_now: () => performance.now(),
			time_sleep: (duration_ms) => {
				if (duration_ms > 0) {
					// TODO(bill): Does this even make any sense?
				}
			},

			sqrt:    Math.sqrt,
			sin:     Math.sin,
			cos:     Math.cos,
			pow:     Math.pow,
			fmuladd: (x, y, z) => x*y + z,
			ln:      Math.log,
			exp:     Math.exp,
			ldexp:   (x, exp) => x * Math.pow(2, exp),

			rand_bytes: (ptr, len) => {
				const view = new Uint8Array(wasmMemoryInterface.memory.buffer, ptr, len)
				if (wasmMemoryInterface.isShared) {
					const tmp = new Uint8Array(len)
					crypto.getRandomValues(tmp)
					view.set(tmp)
					return
				}
				crypto.getRandomValues(view)
			},
		},
		"odin_dom": {
			init_event_raw: (ep) => {
				const W = wasmMemoryInterface.intSize;
				let offset = ep;
				let off = (amount, alignment) => {
					if (alignment === undefined) {
						alignment = Math.min(amount, W);
					}
					if (offset % alignment != 0) {
						offset += alignment - (offset%alignment);
					}
					let x = offset;
					offset += amount;
					return x;
				};

				let align = (alignment) => {
					const modulo = offset & (alignment-1);
					if (modulo != 0) {
						offset += alignment - modulo
					}
				};

				let wmi = wasmMemoryInterface;

				if (!event_temp.data) {
					return;
				}

				let e = event_temp.data.event;

				wmi.storeU32(off(4), event_temp.data.name_code);
				if (e.target == document) {
					wmi.storeU32(off(4), 1);
				} else if (e.target == window) {
					wmi.storeU32(off(4), 2);
				} else {
					wmi.storeU32(off(4), 0);
				}
				if (e.currentTarget == document) {
					wmi.storeU32(off(4), 1);
				} else if (e.currentTarget == window) {
					wmi.storeU32(off(4), 2);
				} else {
					wmi.storeU32(off(4), 0);
				}

				align(W);

				wmi.storeI32(off(W), event_temp.data.id_ptr);
				wmi.storeUint(off(W), event_temp.data.id_len);

				align(8);
				wmi.storeF64(off(8), e.timeStamp*1e-3);

				wmi.storeU8(off(1), e.eventPhase);
				let options = 0;
				if (!!e.bubbles)    { options |= 1<<0; }
				if (!!e.cancelable) { options |= 1<<1; }
				if (!!e.composed)   { options |= 1<<2; }
				wmi.storeU8(off(1), options);
				wmi.storeU8(off(1), !!e.isComposing);
				wmi.storeU8(off(1), !!e.isTrusted);

				align(8);
				if (e instanceof WheelEvent) {
					wmi.storeF64(off(8), e.deltaX);
					wmi.storeF64(off(8), e.deltaY);
					wmi.storeF64(off(8), e.deltaZ);
					wmi.storeU32(off(4), e.deltaMode);
				} else if (e instanceof MouseEvent) {
					wmi.storeI64(off(8), e.screenX);
					wmi.storeI64(off(8), e.screenY);
					wmi.storeI64(off(8), e.clientX);
					wmi.storeI64(off(8), e.clientY);
					wmi.storeI64(off(8), e.offsetX);
					wmi.storeI64(off(8), e.offsetY);
					wmi.storeI64(off(8), e.pageX);
					wmi.storeI64(off(8), e.pageY);
					wmi.storeI64(off(8), e.movementX);
					wmi.storeI64(off(8), e.movementY);

					wmi.storeU8(off(1), !!e.ctrlKey);
					wmi.storeU8(off(1), !!e.shiftKey);
					wmi.storeU8(off(1), !!e.altKey);
					wmi.storeU8(off(1), !!e.metaKey);

					wmi.storeI16(off(2), e.button);
					wmi.storeU16(off(2), e.buttons);

					if (e instanceof PointerEvent) {
						wmi.storeF64(off(8), e.altitudeAngle);
						wmi.storeF64(off(8), e.azimuthAngle);
						wmi.storeInt(off(W), e.persistentDeviceId);
						wmi.storeInt(off(W), e.pointerId);
						wmi.storeInt(off(W), e.width);
						wmi.storeInt(off(W), e.height);
						wmi.storeF64(off(8), e.pressure);
						wmi.storeF64(off(8), e.tangentialPressure);
						wmi.storeF64(off(8), e.tiltX);
						wmi.storeF64(off(8), e.tiltY);
						wmi.storeF64(off(8), e.twist);
						if (e.pointerType == "pen") {
							wmi.storeU8(off(1), 1);
						} else if (e.pointerType == "touch") {
							wmi.storeU8(off(1), 2);
						} else {
							wmi.storeU8(off(1), 0);
						}
						wmi.storeU8(off(1), !!e.isPrimary);
					}

				} else if (e instanceof KeyboardEvent) {
					// Note: those strings are constructed
					// on the native side from buffers that
					// are filled later, so skip them
					const keyPtr  = off(W*2, W);
					const codePtr = off(W*2, W);

					wmi.storeU8(off(1), e.location);

					wmi.storeU8(off(1), !!e.ctrlKey);
					wmi.storeU8(off(1), !!e.shiftKey);
					wmi.storeU8(off(1), !!e.altKey);
					wmi.storeU8(off(1), !!e.metaKey);

					wmi.storeU8(off(1), !!e.repeat);

					wmi.storeI32(off(4), e.charCode);

					wmi.storeInt(off(W, W), e.key.length)
					wmi.storeInt(off(W, W), e.code.length)
					wmi.storeString(off(32, 1), e.key);
					wmi.storeString(off(32, 1), e.code);
				} else if (e.type === 'scroll') {
					wmi.storeF64(off(8, 8), window.scrollX);
					wmi.storeF64(off(8, 8), window.scrollY);
				} else if (e.type === 'visibilitychange') {
					wmi.storeU8(off(1), !document.hidden);
				} else if (e instanceof GamepadEvent) {
					const idPtr      = off(W*2, W);
					const mappingPtr = off(W*2, W);

					wmi.storeI32(off(W, W), e.gamepad.index);
					wmi.storeU8(off(1), !!e.gamepad.connected);
					wmi.storeF64(off(8, 8), e.gamepad.timestamp);

					wmi.storeInt(off(W, W), e.gamepad.buttons.length);
					wmi.storeInt(off(W, W), e.gamepad.axes.length);

					for (let i = 0; i < 64; i++) {
						if (i < e.gamepad.buttons.length) {
							let b = e.gamepad.buttons[i];
							wmi.storeF64(off(8, 8), b.value);
							wmi.storeU8(off(1),  !!b.pressed);
							wmi.storeU8(off(1),  !!b.touched);
						} else {
							off(16, 8);
						}
					}
					for (let i = 0; i < 16; i++) {
						if (i < e.gamepad.axes.length) {
							let a = e.gamepad.axes[i];
							wmi.storeF64(off(8, 8), a);
						} else {
							off(8, 8);
						}
					}

					let idLength = e.gamepad.id.length;
					let id = e.gamepad.id;
					if (idLength > 96) {
						idLength = 96;
						id = id.slice(0, 93) + '...';
					}

					let mappingLength = e.gamepad.mapping.length;
					let mapping = e.gamepad.mapping;
					if (mappingLength > 64) {
						mappingLength = 61;
						mapping = mapping.slice(0, 61) + '...';
					}

					wmi.storeInt(off(W, W), idLength);
					wmi.storeInt(off(W, W), mappingLength);
					wmi.storeString(off(96, 1), id);
					wmi.storeString(off(64, 1), mapping);
				}
			},

			add_event_listener: (id_ptr, id_len, name_ptr, name_len, name_code, data, callback, use_capture) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let name = wasmMemoryInterface.loadString(name_ptr, name_len);
				let element = getElement(id);
				if (element == undefined) {
					return false;
				}
				let key = listener_key(id, name, data, callback, !!use_capture);
				if (wasmMemoryInterface.listenerMap.has(key)) {
					return false;
				}

				let listener = (e) => {
					let event_data = {};
					event_data.id_ptr = id_ptr;
					event_data.id_len = id_len;
					event_data.event = e;
					event_data.name_code = name_code;

					onEventReceived(event_data, data, callback);
				};
				wasmMemoryInterface.listenerMap.set(key, listener);
				element.addEventListener(name, listener, !!use_capture);
				return true;
			},

			add_window_event_listener: (name_ptr, name_len, name_code, data, callback, use_capture) => {
				let name = wasmMemoryInterface.loadString(name_ptr, name_len);
				let element = window;
				let key = listener_key('window', name, data, callback, !!use_capture);
				if (wasmMemoryInterface.listenerMap.has(key)) {

/**
 * @param {string} wasmPath                          - Path to the WASM module to run
 * @param {?HTMLPreElement} consoleElement           - Optional console/pre element to append output to, in addition to the console
 * @param {any} extraForeignImports                  - Imports, in addition to the default runtime to provide the module
 * @param {?WasmMemoryInterface} wasmMemoryInterface - Optional memory to use instead of the defaults
 * @param {?int} intSize                             - Size (in bytes) of the integer type, should be 4 on `js_wasm32` and 8 on `js_wasm64p32`
 */
async function runWasm(wasmPath, consoleElement, extraForeignImports, wasmMemoryInterface, intSize = 4) {
	if (!wasmMemoryInterface) {
		wasmMemoryInterface = new WasmMemoryInterface();
	}
	wasmMemoryInterface.setIntSize(intSize);

	let imports = odinSetupDefaultImports(wasmMemoryInterface, consoleElement, wasmMemoryInterface.memory);
	let exports = {};

	if (extraForeignImports !== undefined) {
		imports = {
			...imports,
			...extraForeignImports,
		};
	}

	const response = await fetch(wasmPath);
	const file = await response.arrayBuffer();
	const wasm = await WebAssembly.instantiate(file, imports);
	exports = wasm.instance.exports;
	wasmMemoryInterface.setExports(exports);

	if (exports.memory) {
		if (wasmMemoryInterface.memory) {
			console.warn('WASM module exports memory, but `runWasm` was given an interface with existing memory too. Did you mean to use `-extra-linker-flags:"--import-memory"` to tell the compiler not to export memory?');
		}
		wasmMemoryInterface.setMemory(exports.memory);
	}

	if (exports._start) {
		exports._start();
	}

	// Define a `@export step :: proc(delta_time: f64) -> (keep_going: bool) {`
	// in your app and it will get called every frame.
	// return `false` to stop the execution of the module.
	if (exports.step) {
		const odin_ctx = exports.default_context_ptr();

		let prevTimeStamp = undefined;
		function step(currTimeStamp) {
			if (prevTimeStamp == undefined) {
				prevTimeStamp = currTimeStamp;
			}

			const dt = (currTimeStamp - prevTimeStamp)*0.001;
			prevTimeStamp = currTimeStamp;

			if (!exports.step(dt, odin_ctx)) {
				if (exports._end) {
					exports._end();
				}
				return;
			}

			window.requestAnimationFrame(step);
		}

		window.requestAnimationFrame(step);
	} else {
		if (exports._end) {
			exports._end();
		}
	}

	return;
};

window.odin = {
	// Interface Types
	WasmMemoryInterface: WasmMemoryInterface,
	WebGLInterface:      WebGLInterface,

	// Functions
	setupDefaultImports: odinSetupDefaultImports,
	runWasm:             runWasm,
};

<script id="dds-js">// DDS in the player: the solver's wasm module (build.py) opened with do-nothing WASI imports, and the two calls
// the player makes of it - a whole deal's double-dummy trick table, and every position of a recorded play
// solved card by card (`solve`). Plain script, no module syntax: the
// player inlines it into its page and into its DDS worker, and check.mjs evaluates it in node.
//
// `cards` is DDS's `ddTableDeal`: 16 u32, [hand N,E,S,W][suit S,H,D,C], rank r (2..14) as bit r. The result is
// DDS's `ddTableResults.resTable`: 20 i32, [strain S,H,D,C,NT][hand N,E,S,W], tricks for that declarer.
async function ddsStart(module) {
	let memory = null;
	const view = () => new DataView(memory.buffer);
	const wasi = {
		fd_write: (fd, iovs, count, written) => {
			let n = 0;
			for (let i = 0; i < count; i++) n += view().getUint32(iovs + 8 * i + 4, true);
			view().setUint32(written, n, true);
			return 0;
		},
		environ_sizes_get: (count, size) => { view().setUint32(count, 0, true); view().setUint32(size, 0, true); return 0; },
		environ_get: () => 0,
		fd_close: () => 0, fd_fdstat_get: () => 8, fd_read: () => 8, fd_seek: () => 8,
		proc_exit: (code) => { throw new Error("DDS stopped (" + code + ")"); },
	};
	const instance = await WebAssembly.instantiate(module, { wasi_snapshot_preview1: wasi });
	const dds = instance.exports;
	memory = dds.memory;
	dds._initialize();
	// One thread, and DDS's small transposition table (~25-48 MB in all): the large one measured no faster on
	// whole tables. Below ~23 MB DDS gives itself no thread at all.
	dds.SetResources(50, 1);
	const deal = dds.malloc(64), results = dds.malloc(80);
	const position = dds.malloc(96), future = dds.malloc(216);
	return {
		table(cards) {
			new Uint32Array(memory.buffer, deal, 16).set(cards);
			const status = dds.CalcDDtable(deal, results); // a struct by value is passed by pointer on wasm32
			if (status !== 1) throw new Error("DDS could not solve the deal (" + status + ")");
			return new Int32Array(memory.buffer, results, 20).slice();
		},
		// `count` positions, each DDS's `deal` struct (96 bytes, back to back in `positions`), solved for every
		// legal card with its score (`SolveBoard` target -1, solutions 3, mode 1: `replay`'s DDS_* constants).
		// The answers are DDS's `futureTricks`, 216 bytes each, back to back.
		solve(positions, count) {
			const out = new Uint8Array(216 * count);
			for (let i = 0; i < count; i++) {
				new Uint8Array(memory.buffer, position, 96).set(positions.subarray(96 * i, 96 * i + 96));
				const status = dds.SolveBoard(position, -1, 3, 1, future, 0);
				if (status !== 1) throw new Error("DDS could not solve a position (" + status + ")");
				out.set(new Uint8Array(memory.buffer, future, 216), 216 * i);
			}
			return out;
		},
	};
}

			const count = wasm.pl_play_positions(i);
			return count ? { positions: new Uint8Array(wasm.memory.buffer, wasm.pl_positions(), 96 * count).slice(), count } : null;
		};
		// The DDS lane's two kinds of job: a board's table (0), and its play's positions (1).
		const ddsJob = (id) => (id < boards ? { board: id, cards: tableDeal(id) } : { board: id, ...playPositions(id - boards) });
		// The same for DDS: with the analysis spread over workers, a deal's table (~0.2s) was what the reader waited
		// for. Each DDS worker holds ~50 MB.
		const ddsLane = lane({
			kinds: 2,
			workers: comboWorkers,
			source: () => ddsSource + "\n(" + ddsWorker.toString() + ")();",
			init: async () => ({ module: await ddsCompiled() }),
			job: ddsJob,
			here: async (id) => {
				ddsHere = ddsHere || await ddsStart(await ddsCompiled());
				const message = ddsJob(id);
				return message.cards ? ddsHere.table(message.cards) : ddsHere.solve(message.positions, message.count);
			},
			take: (id, result) => {
				if (id >= boards) {
					const board = id - boards;
					new Uint8Array(wasm.memory.buffer, wasm.pl_futures(), result.length).set(result);
					const length = wasm.pl_play(board); // first: it may move the buffer `pl_piece` points at
					if (!length) return; // answers that make no sense: the page keeps the play it has
					const html = new TextDecoder().decode(new Uint8Array(wasm.memory.buffer, wasm.pl_piece(), length).slice());
					plays[board] = new TextEncoder().encode(html);
					if (typeof window.ncAddPlay === "function") window.ncAddPlay(board, html);
					return;
				}
				const board = id, tricks = result;
				new Int32Array(wasm.memory.buffer, wasm.pl_tricks(), 20).set(tricks);
				const length = wasm.pl_exact(board); // first: it may move the buffer `pl_piece` points at
				const html = new TextDecoder().decode(new Uint8Array(wasm.memory.buffer, wasm.pl_piece(), length).slice());
				exacts[board] = new TextEncoder().encode(html);
				if (typeof window.ncAddSim === "function") window.ncAddSim(board, html);
			},
		});
		if (analyse) {
			window.ncRequestAnalysis = (list) => {
				for (const i of list) {
					if (i < 0 || i >= boards) continue;
					comboLane.want(i);
					if (wasm.pl_table_deal(i)) ddsLane.want(i);
				}
				showNote();
				comboLane.pump();
				ddsLane.pump();
			};
		}
		// THE 2-HAND ADVISOR'S SAMPLING, asked for from the CCA panel's verdict band (`window.ncRequestSample`): the
		// unseen 26 cards dealt to the defenders up to SAMPLE_CAP times and every layout solved double dummy - the
		// make-% for every contract, the opening-lead sub-grids and the guess tax, as the advisor's page has them.
		// It is the heavy one (~20 ms a layout on a desktop's workers, ~110 ms on a 2018 phone), so it gets a POOL
		// of DDS workers, one per processor but one (at most 8), started for the boards asked for and closed when
		// they are done (each holds ~50 MB). One board at a time, a round of `sampled.ROUND` layouts at once, split
		// over the pool; after each round the player says whether the verdict has settled (`pl_sample_round`), so
		// a lopsided board stops at 200 layouts. Without workers, the page's thread does it, a breath a layout.
		const SAMPLE_CAP = 300, SAMPLE_ROUND = 40;
		const sampleWanted = new Set();
		let sampling = false, pool = null;
		const poolSize = Math.max(1, Math.min(8, (navigator.hardwareConcurrency || 2) - 1));
		const call = (worker, message) => new Promise((resolve, reject) => {
			worker.onmessage = (event) => resolve(event.data);
			worker.onerror = (event) => reject(new Error(event.message || "a DDS worker failed"));
			worker.postMessage(message);
		});
		const openPool = async () => {
			try {
				const module = await ddsCompiled();
				const url = URL.createObjectURL(new Blob([ddsSource + "\n(" + ddsWorker.toString() + ")();"], { type: "text/javascript" }));
				const workers = Array.from({ length: poolSize }, () => new Worker(url));
				await Promise.all(workers.map((w) => call(w, { init: { module } })));
				return workers;
			} catch (error) {
				console.warn("DDS workers unavailable, sampling on the page's thread:", error);
				return [];
			}
		};
		const closePool = () => { if (pool) pool.forEach((w) => w.terminate()); pool = null; };
		// `n` layouts (16 u32 each) -> their tables (20 i32 each), over the pool, else on this thread.
		const solveLayouts = async (deals, n) => {
			const out = new Int32Array(20 * n);
			if (pool.length) {
				// One layout a message, each worker taking the next as it finishes: layouts differ several-fold in
				// how long they take, and fixed shares left most of the pool waiting for the slowest.
				let next = 0;
				await Promise.all(pool.map(async (worker) => {
					for (let k = next++; k < n; k = next++) {
						const answer = await call(worker, { board: k, batch: deals.slice(16 * k, 16 * k + 16) });
						out.set(answer.result, 20 * k);
					}
				}));
				return out;
			}
			ddsHere = ddsHere || await ddsStart(await ddsCompiled());
			for (let k = 0; k < n; k++) {
				await new Promise((r) => setTimeout(r, 0));
				out.set(ddsHere.table(deals.subarray(16 * k, 16 * k + 16)), 20 * k);
			}
			return out;
		};
		const sampleBoard = async (i) => {
			const count = wasm.pl_sample_start(i, SAMPLE_CAP);
			if (!count) return;
			for (let from = 0; from < count; ) {
				const n = Math.min(SAMPLE_ROUND, count - from);
				const deals = new Uint32Array(wasm.memory.buffer, wasm.pl_sample_deals(from, n), 16 * n).slice();
				const tables = await solveLayouts(deals, n);
				new Int32Array(wasm.memory.buffer, wasm.pl_sample_tables(), 20 * n).set(tables);
				from += n;
				const settled = wasm.pl_sample_round(n);
				sampleStatus = `sampling board ${i + 1}: ${from} of up to ${count} deals`;
				showNote();
				if (typeof window.ncSampleProgress === "function") window.ncSampleProgress(i, from, count);
				if (settled) break;
			}
			const length = wasm.pl_sample_finish(i); // first: it may move the buffer `pl_piece` points at
			if (!length) return;
			const html = new TextDecoder().decode(new Uint8Array(wasm.memory.buffer, wasm.pl_piece(), length).slice());
			samples[i] = new TextEncoder().encode(html);
			if (typeof window.ncAddSample === "function") window.ncAddSample(i, html);
		};
		const sampleLoop = async () => {
			if (sampling) return;
			sampling = true;
			try {
				while (sampleWanted.size) {
					const at = typeof window.ncActiveBoard === "function" ? window.ncActiveBoard() : 0;
					let next = -1;
					for (const i of sampleWanted) if (next < 0 || Math.abs(i - at) < Math.abs(next - at)) next = i;
					sampleWanted.delete(next);
					if (!pool) pool = typeof Worker === "function" ? await openPool() : [];
					await sampleBoard(next);
				}
			} catch (error) {
				sampleStatus = "sampling failed: " + error.message;
			} finally {
				closePool();
				sampling = false;
				if (!sampleStatus.startsWith("sampling failed")) sampleStatus = "";
				showNote();
			}
		};
		if (parStarts.some((at, i) => at !== playStarts[i])) {
			window.ncRequestSample = (list) => {
				for (const i of list) if (i >= 0 && i < boards && parStarts[i] !== playStarts[i] && !samples[i]) sampleWanted.add(i);
				sampleLoop();
			};
		}
		if (playStarts.some((at, i) => at !== ends[i])) {
			window.ncRequestPlay = (list) => {
				for (const i of list) if (i >= 0 && i < boards && playStarts[i] !== ends[i]) ddsLane.want(i, 1);
				showNote();
				ddsLane.pump();
			};
		}
		window.ncAnalysing = analyse;
		document.open();
		document.write(html);
		document.close();

		// SAVE PAGE: the page as a generated file holds it, so it opens from disk with no link and no player. The
		// browser's own "save page" writes the page as it is NOW - its carousel already built - and the card page's
		// script, running again over that on opening, finds no boards. This writes the html the script has not
		// touched yet: the plain page with each board's analysis put back where `pl_board_end` says (offsets are
		// UTF-8 bytes) - the splice `check.mjs` holds to the native page byte for byte - and each board's
		// double-dummy grid before it, where the advisor's page has it; a recorded play whose costs were worked out
		// replaces the play without them (`pl_play_start` to the board's end), and a sampled 2-hand board's `.par`
		// the one without the sampling (`pl_par_start` to `pl_play_start`). Only the boards whose analysis the
		// reader has had calculated carry it: saving works nothing out.
		const saveButton = document.createElement("button");
		saveButton.id = "nc-save";
		saveButton.textContent = "Save";
		saveButton.title = "Save these deals as a page of their own, which opens from disk with no link. " +
			"Boards whose analysis you have calculated (CCA) keep it.";
		saveButton.onclick = () => {
			const parts = [];
			let from = 0;
			for (let i = 0; i < boards; i++) {
				let cut = from;
				if (samples[i]) { parts.push(plain.subarray(cut, parStarts[i]), samples[i]); cut = playStarts[i]; }
				if (plays[i]) parts.push(plain.subarray(cut, playStarts[i]), plays[i]);
				else parts.push(plain.subarray(cut, ends[i]));
				if (exacts[i]) parts.push(exacts[i]);
				if (pieces[i]) parts.push(pieces[i]);
				from = ends[i];
			}
			parts.push(plain.subarray(from));
			const name = (document.title || "").replace(/[\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim() || "bridge deals";
			const link = document.createElement("a");
			link.href = URL.createObjectURL(new Blob(parts, { type: "text/html" }));
			link.download = name + ".html";
			document.body.appendChild(link);
			link.click();
			link.remove();
			setTimeout(() => URL.revokeObjectURL(link.href), 60000);
		};
		const qrButton = document.getElementById("nc-qr");
		if (qrButton) qrButton.after(saveButton);
	} catch (error) {
		say("This browser could not build the deals: " + error.message);
	}
})();
</script>
</body></html>
