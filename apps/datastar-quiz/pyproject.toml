[project]
# Deliberately its own uv project rather than a member of the root one: this is an
# experiment sitting beside the panel app (`apps/quiz/`), and litestar/datastar have no
# business in the root lock that the bml build and the panel app share.
#
#   uv run --project apps/datastar-quiz litestar --app app:app run
#
# The quiz domain code is NOT a dependency -- `corpus.py` puts `apps/quiz/` on sys.path and
# imports `quiz` / `bidfilter` from there (both are panel-free), and those in turn import the
# stdlib-only `bml` / `bmlbids` from BML_TOOLS_DIRECTORY. Nothing under apps/quiz is modified.
name = "bridge-datastar-quiz"
version = "0.1.0"
description = "Datastar/Litestar hypermedia port of the panel bidding quiz"
requires-python = "==3.14.*"
# Major-version pins for anything past 1.0; `>=` only for 0.x, whose minors are breaking anyway.
dependencies = [
    "datastar-py==1.*",  # zero-dependency SSE generator + data-* attribute helpers
    "litestar[brotli,jinja]==2.*",  # brings msgspec; jinja for the html; brotli for compression
    # THE SERVER THE DEPLOYMENT RUNS, so it is a plain dependency and `uv sync --no-dev` on the box
    # is complete with no flags to remember. Pure python, ~2 small wheels. granian is faster and is
    # what `just serve` uses, but it cannot be the dependency: its wheels are manylinux / musllinux
    # / macos / win_amd64 only (check `uv.lock`), and the box is FreeBSD -- `uv sync` there would
    # build it from the sdist and need a rust toolchain.
    "uvicorn>=0.52",
]

[project.optional-dependencies]
# granian is an extra rather than a dependency for the FreeBSD reason above; the dev group pulls it
# in anyway, so `just serve` needs no `--extra`. Select it explicitly only for a non-FreeBSD
# deployment: `uv sync --no-dev --extra granian`.
granian = ["granian==2.*"]
# Optional OpenTelemetry, mirroring the panel app's `telemetry` extra. `telemetry.py` falls
# back to a no-op tracer when these are absent, so the instrumentation stays unconditional.
telemetry = [
    "litestar[opentelemetry]==2.*",
    "opentelemetry-distro>=0.65b0",
    "opentelemetry-exporter-otlp-proto-grpc==1.*",
]
# yappi, the instrumenting profiler (`profiling.py`, `just serve-profiled`). An extra rather than a
# dependency because it is only ever wanted deliberately: sampling with py-spy cannot profile this
# server usefully (it suspends the single event loop, and its nonblocking mode loses ~35% of samples
# to torn reads), so the alternative is instrumentation, and instrumentation is not something to have
# installed on the deployment box.
profiling = ["yappi>=1.6"]

[dependency-groups]
dev = [
    # the faster server, so `just serve` needs no `--extra`; the `reload` extra (watchfiles) is
    # dev-only weight. uvicorn is NOT repeated here -- it is a plain dependency above
    "granian[reload]==2.*",
    "pytest==9.*",
    "pytest-xdist==3.*",
    "ruff>=0.16",  # astral linter + formatter
    "ty>=0.0.66",  # astral type checker
    # ALSO in the dev group, not only the `profiling` extra: profiling is a local activity, and having
    # it here means `just typecheck` can resolve `import yappi` for real rather than being told to
    # ignore it. The extra is what a non-dev environment would select.
    "yappi>=1.6",
]

[tool.ty.environment]
# `corpus.py` prepends `apps/quiz/` to sys.path at import time so `quiz` / `bidfilter` resolve;
# ty needs telling about the same path, or every use of them is an unresolved import.
extra-paths = ["../quiz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff-sync]
# The canonical [tool.ruff] block below is gc-pyproject's; refresh it with
# `uv run gc-ruff-sync` from a checkout that has GITLAB_TOKEN set (see ~/dev/gc-pyproject/README.md).
upstream = "https://git.int.gigaclear.net/api/v4/projects/gis%2Fgc-pyproject/repository/files/pyproject.toml/raw?ref=0.3.1"
exclude = ["lint.per-file-ignores", "target-version"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Rule prefixes. A "reasonably strict, broadly used" set. Full list at https://docs.astral.sh/ruff/rules/
select = [
    "A",        # flake8-builtins — shadowing builtins (`id`, `type`, `list` as parameter / variable names)
    "ANN",      # flake8-annotations — missing type annotations on public functions/methods (see ANN401 ignore)
    "ARG",      # flake8-unused-arguments — unused function/method/lambda args
    "ASYNC",    # flake8-async — blocking calls inside async functions (open(), time.sleep, requests, subprocess)
    "B",        # flake8-bugbear — likely bugs / design flaws (mutable default args, B008, B904 raise-from, etc.)
    "BLE",      # flake8-blind-except — bare `except:` / `except Exception:` without re-raise or logging
    "C4",       # flake8-comprehensions — wasteful list/set/dict comprehensions and generator misuse
    "DTZ",      # flake8-datetimez — naive datetime usage (force tz-aware)
    "E",        # pycodestyle errors — PEP 8 errors (whitespace, indentation, statement separation)
    "EM",       # flake8-errmsg — exception message must be variable, not literal/f-string inside `raise`
    "F",        # Pyflakes — unused imports/vars, undefined names, redefinitions
    "FIX001",   # flake8-fixme — line contains FIXME (ban only; TODO/XXX/HACK left informational)
    "FLY",      # flynt — static `str.join`/`%`-format/`.format` → f-string
    "G",        # flake8-logging-format — `logger.info("x %s", v)` not `logger.info(f"x {v}")`
    "I001",     # isort — import block sort/group order (only the "unsorted" rule, not the broader I)
    "INP",      # flake8-no-pep420 — missing `__init__.py` (no implicit namespace packages)
    "ISC",      # flake8-implicit-str-concat — catch accidental adjacent-string-literal concatenation
    "LOG",      # flake8-logging — modern logging API misuse (complements G's format-string focus)
    "N",        # pep8-naming — class CamelCase, function snake_case, constant SCREAMING_SNAKE
    "PERF",     # Perflint — `.append` in loops vs list-comp, unnecessary list() in `any()`/`all()`, etc.
    "PGH004",   # pygrep-hooks — ban blanket `# noqa` (require specific code)
    "PIE",      # flake8-pie — misc anti-patterns (unnecessary dict/list/pass, duplicate class fields)
    "PT",       # flake8-pytest-style — pytest idioms (parametrize tuples, fixture scope, raises usage)
    "PTH",      # flake8-use-pathlib — prefer `pathlib.Path` over `os.path` / `os.makedirs` / `open(...)`
    "Q",        # flake8-quotes — consistent quote style (matches `ruff format`)
    "RET",      # flake8-return — unnecessary `else` after return, redundant `return None`, etc.
    "RSE",      # flake8-raise — unnecessary parens on `raise Foo()`
    "RUF",      # Ruff-specific — extras the Ruff team owns (RUF005 list-concat, RUF012 mutable class attrs, etc.)
    "S",        # flake8-bandit — security smells (eval, pickle, hardcoded passwords, subprocess shell=True)
    "SIM",      # flake8-simplify — collapse `if-else` ternaries, `dict.get`, contextlib.suppress, etc.
    "SLF",      # flake8-self — access to `_private` members from outside the owning class
    "T10",      # flake8-debugger — leftover `breakpoint()` / `pdb.set_trace()`
    "T20",      # flake8-print — leftover `print()` / `pprint()`
    "TCH",      # flake8-type-checking — push annotation-only imports under `if TYPE_CHECKING:` (see TC002/TC003 ignores)
    "TRY",      # tryceratops — exception-handling smells (long try blocks, raise-from, abstract-raise)
    "UP",       # pyupgrade — modernise syntax for `target-version` (typing.Optional → `| None`, super(), f-strings)
    "W",        # pycodestyle warnings — trailing whitespace, blank-line newlines, etc.
    "YTT",      # flake8-2020 — incorrect `sys.version` / `sys.version_info` comparisons
]

ignore = [
    "S101",     # flake8-bandit — keep `assert` statements; we use them as sanity checks, not just test scaffolding.
                #     Stripped under `python -O` but production code never runs with -O.
    "PT001",    # flake8-pytest-style — parentheses-on-fixture style (`@pytest.fixture()` vs `@pytest.fixture`).
                #     Bikeshed; ruff's preference flips between releases. Don't churn over it.
    "TRY002",   # tryceratops — "create your own exception type". Generic `Exception`/`RuntimeError` is fine for
                #     library-internal raise sites; not every error needs a bespoke class.
    "TRY003",   # tryceratops — "avoid long messages outside the exception class". Long human-readable messages
                #     at the raise site are more useful than a class hierarchy that hides them.
    "ISC001",   # flake8-implicit-str-concat — single-line implicit string concat. `ruff format` flags the same
                #     thing differently and the two can fight. Disable to let the formatter own this.
    "ANN401",   # flake8-annotations — ban `typing.Any`. We use `Any` deliberately at plugin / decorator
                #     boundaries: FieldDefinition values, `*args`/`**kwargs` forwarders, runtime-introspected
                #     callbacks. Tightening here would require a flood of per-line noqas.
    "TC002",    # flake8-type-checking — third-party imports used only in annotations should move under
                #     `if TYPE_CHECKING:`. Refused: forces extra import block, no runtime gain (already lazy via
                #     `from __future__ import annotations`), confuses tooling that resolves runtime types.
    "TC003",    # flake8-type-checking — same as TC002 but for stdlib imports. Same reasoning.
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# INP001: these are deliberately FLAT modules, not a package -- the app is served from its own
#     directory (as `apps/quiz/` is), and `corpus.py`'s sys.path shim depends on that layout.
"*.py" = ["INP001"]
# ANN: tests do not need annotation coverage.
# ARG001: pytest fixtures are passed by interface, often unused in the body.
# SLF001: tests legitimately reach into private members to assert internal state.
# S101 is already globally allowed; S603/S607 cover the deliberate subprocess in test_imports.py.
"tests/*" = ["ANN", "ARG001", "SLF001", "S603", "S607", "PLR2004"]
# T201: `tools/` holds command-line measurement scripts whose whole job is printing a report.
"tools/*" = ["T201"]
