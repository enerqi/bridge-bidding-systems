[package]
name = "dsquiz"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "The bidding quiz again, in Rust: the fourth implementation, for the runtime comparison"

[lib]
name = "dsquiz"
path = "src/lib.rs"

[[bin]]
name = "quizd"
path = "src/main.rs"

[dependencies]
# The server. tokio + axum is the mainstream async stack, and axum is `tower`/`hyper` underneath,
# which is what makes the compression story below tractable.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip"] }
# The official Datastar SDK. Unlike the Go one it has no `ServerSentEventGenerator`: the framework
# owns the stream, and the SDK hands back framework-native events.
datastar = { version = "0.4", features = ["axum"] }
# Compile-time templates: the markup is checked and turned into `write!` calls against one buffer,
# so a render is one allocation rather than a tree walk. See the note in `render`.
askama = "0.16"
# Streams with `await` points in them, which is what the answer choreography is.
async-stream = "0.3"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# brotli, driven by hand: tower-http will not compress an SSE stream (see `web::sse`).
brotli = "8"
flate2 = "1"
# Faster than `std::sync` and, more usefully here, no lock poisoning: a panic in one handler must
# not take every session with it.
parking_lot = "0.12"
lru = "0.18"
rand = "0.10"
# TWEAK 2 (experiment): the global allocator. Rust's default on Windows is the system heap
# (`HeapAlloc`), which is a locked, general-purpose allocator; this app allocates several small
# `String`s per request through it. mimalloc is the usual one-line answer.
mimalloc = { version = "0.1", default-features = false }

[[bench]]
name = "micro"
harness = false

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
# The comparison is about the runtime, so the release profile is the one a deployment would use --
# and `lto`/`codegen-units=1` are what "a Rust build" means to anyone reading these numbers.
lto = "thin"
codegen-units = 1
panic = "abort"
