[project]
name = "bridge-bidding-apps"
version = "0.1.0"
description = "Apps built on top of BML system data"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "docopt>=0.6.2",
    "panel>=1.8.2",
    "watchfiles>=1.1.1",
]

[project.optional-dependencies]
# Optional OpenTelemetry tracing for the quiz app (see quiz_app_telemetry_setup.py /
# run-jaeger-tracing.cmd). Install with: uv sync --extra telemetry
telemetry = [
    "opentelemetry-distro>=0.65b0",
    "opentelemetry-instrumentation-asyncio==0.65b0",
    "opentelemetry-instrumentation-dbapi==0.65b0",
    "opentelemetry-instrumentation-logging==0.65b0",
    "opentelemetry-instrumentation-sqlite3==0.65b0",
    "opentelemetry-instrumentation-threading==0.65b0",
    "opentelemetry-instrumentation-urllib==0.65b0",
    "opentelemetry-instrumentation-wsgi==0.65b0",
    "opentelemetry-instrumentation-jinja2==0.65b0",
    "opentelemetry-instrumentation-requests==0.65b0",
    "opentelemetry-instrumentation-tornado==0.65b0",
    "opentelemetry-instrumentation-urllib3==0.65b0",
    "opentelemetry-exporter-otlp-proto-grpc",
]

[tool.uv]
constraint-dependencies = [
    "numpy>=1.26.0,<2.4",  # CPU features problem on old freebsd hardware
]
# Build environments (PEP 517 isolated envs, e.g. pandas' build-system.requires)
# resolve independently of the lock and of constraint-dependencies, so the numpy
# pin has to be repeated here or the pandas build imports a numpy whose SIMD
# baseline the old Athlon X2 can't execute (SIGILL during meson setup).
build-constraint-dependencies = [
    "numpy>=1.26.0,<2.4",
]

# If the <2.4 ceiling ever has to be lifted, the escape is to build numpy with
# the baseline explicitly lowered -- `none` is the value numpy's own 2.4.0 notes
# name for pre-2009 CPUs:
#
#   [tool.uv.config-settings-package]
#   numpy = { setup-args = "-Dcpu-baseline=none" }
#
# Left commented out because it was never observed to take effect here, and it is
# unverified whether uv threads config settings into a *nested* PEP 517 build env
# (numpy as pandas' build dep) -- the version ceiling is what covers that case.
# If you do test it: neither pip nor uv key cached wheels on config settings, so
# `uv cache clean numpy` first or you will re-test the old wheel.
# Docs: docs.astral.sh/uv/reference/settings/#config-settings-package
#       numpy.org/doc/stable/reference/simd/build-options.html

[dependency-groups]
dev = ["pytest"]

[tool.ruff]
line-length = 120
